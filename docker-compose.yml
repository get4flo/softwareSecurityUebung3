services:
  homework:
    build:
      context: .
      dockerfile: ./challenge.docker
    ports:
      - "1337:1337"
    networks:
      - exploit

  exploit:
    build:
      context: .
      dockerfile: ./exploiter.docker
    networks:
      - exploit
    depends_on:
      - homework-dev
    volumes:
      - "./exploit.py:/code/exploit.py"

  homework-dev:
    build:
      context: .
      dockerfile: ./challengeDev.docker
    ports:
      - "1337:1337"
      - "1338:1338"
    networks:
      - exploit

networks:
  exploit:
    driver: bridge
